name: Go CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    # Pinned to an exact tag, not the moving @v1 tag: @v1 has been retired
    # because it drifted patch releases behind while still accepting inputs
    # it did not implement, so a configured input could silently no-op.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.14.17

    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

    with:
      # A shared models package consumed by other datatug repos, not itself
      # a release-cutting CLI; no existing tags in this repo either.
      disable-version-bumping: true
      go_version: '1.27.0'
      # Measured (go test ./... -coverprofile + go tool cover -func): 0.0%.
      # Only source file (ping.go) has no tests; floor set at the true value.
      min_test_coverage_percent: 0
